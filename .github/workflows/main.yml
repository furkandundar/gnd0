name: GND0 Android APK Uretici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Depodaki Kodlari Cek
        uses: actions/checkout@v4

      - name: Node.js Ortamini Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java JDK 21 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: GND0 Capacitor Android Projesini Olustur
        run: |
          mkdir -p www
          cp index.html style.css app.js www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "GND0" "com.gnd0.bench" --web-dir www
          npx cap add android
          npx cap copy android

      - name: GND0 Ozel Android Uygulama Ikonunu Gom
        run: |
          cat << 'EOF' > android/app/src/main/res/drawable/gnd0_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#060911" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/gnd0_fg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#10B981" android:pathData="M54,28m-4,0a4,4 0,1 1,8 0a4,4 0,1 1,-8 0"/>
              <path android:strokeColor="#06B6D4" android:strokeWidth="4.5" android:strokeLineCap="round" android:pathData="M54,34 L54,52"/>
              <path android:strokeColor="#06B6D4" android:strokeWidth="4.5" android:strokeLineCap="round" android:pathData="M32,52 L76,52"/>
              <path android:strokeColor="#06B6D4" android:strokeWidth="4.5" android:strokeLineCap="round" android:pathData="M40,63 L68,63"/>
              <path android:strokeColor="#10B981" android:strokeWidth="4.5" android:strokeLineCap="round" android:pathData="M48,74 L60,74"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/gnd0_bg"/>
              <foreground android:drawable="@drawable/gnd0_fg"/>
          </adaptive-icon>
          EOF

          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Gradle ile GND0 APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: GND0 APK Paketini Hazirla
        uses: actions/upload-artifact@v4
        with:
          name: GND0-v2.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
